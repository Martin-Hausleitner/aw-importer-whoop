[tool.poetry]
name = "aw-importer-whoop"
version = "0.1.0"
description = "Import your own WHOOP data into local ActivityWatch"
authors = ["Martin <local@example.invalid>"]
readme = "README.md"
packages = [{include = "aw_importer_whoop", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.7"
httpx = "^0.27.0"
platformdirs = "^4.2.0"
python-dateutil = "^2.9.0.post0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ruff = "^0.5.0"

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.5.0"]

[tool.poetry.scripts]
aw-importer-whoop = "aw_importer_whoop.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
