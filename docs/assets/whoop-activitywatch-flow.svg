<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">WHOOP to ActivityWatch importer flow</title>
  <desc id="desc">OAuth connects a private WHOOP account, the importer fetches WHOOP API data, and writes normalized events into ActivityWatch buckets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#182c25"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#1f3b33"/><stop offset="1" stop-color="#203245"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#65f0b5"/></marker>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <text x="60" y="72" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="800" fill="#f4fff9">WHOOP → ActivityWatch</text>
  <text x="60" y="110" font-family="Inter, ui-sans-serif, system-ui" font-size="18" fill="#aee8cf">Private local importer with OAuth, refresh tokens, idempotent sync, and local ActivityWatch buckets.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="175" width="240" height="185" rx="24" fill="url(#card)" stroke="#65f0b5" stroke-opacity=".45"/>
    <text x="100" y="225" font-size="28" font-family="Inter, ui-sans-serif" fill="#fff" font-weight="800">1. OAuth</text>
    <text x="100" y="263" font-size="17" font-family="Inter, ui-sans-serif" fill="#d8fff0">Login with your own</text>
    <text x="100" y="288" font-size="17" font-family="Inter, ui-sans-serif" fill="#d8fff0">private WHOOP account.</text>
    <text x="100" y="326" font-size="15" font-family="monospace" fill="#65f0b5">localhost callback</text>
    <rect x="372" y="175" width="240" height="185" rx="24" fill="url(#card)" stroke="#65f0b5" stroke-opacity=".45"/>
    <text x="402" y="225" font-size="28" font-family="Inter, ui-sans-serif" fill="#fff" font-weight="800">2. Importer</text>
    <text x="402" y="263" font-size="17" font-family="Inter, ui-sans-serif" fill="#d8fff0">Refreshes tokens and</text>
    <text x="402" y="288" font-size="17" font-family="Inter, ui-sans-serif" fill="#d8fff0">fetches sleep, workouts,</text>
    <text x="402" y="313" font-size="17" font-family="Inter, ui-sans-serif" fill="#d8fff0">cycles and recovery.</text>
    <rect x="674" y="175" width="240" height="185" rx="24" fill="url(#card)" stroke="#65f0b5" stroke-opacity=".45"/>
    <text x="704" y="225" font-size="28" font-family="Inter, ui-sans-serif" fill="#fff" font-weight="800">3. Normalize</text>
    <text x="704" y="263" font-size="17" font-family="Inter, ui-sans-serif" fill="#d8fff0">Stable hashes prevent</text>
    <text x="704" y="288" font-size="17" font-family="Inter, ui-sans-serif" fill="#d8fff0">duplicates and update</text>
    <text x="704" y="313" font-size="17" font-family="Inter, ui-sans-serif" fill="#d8fff0">changed records.</text>
    <rect x="976" y="175" width="155" height="185" rx="24" fill="url(#card)" stroke="#65f0b5" stroke-opacity=".45"/>
    <text x="1005" y="225" font-size="28" font-family="Inter, ui-sans-serif" fill="#fff" font-weight="800">4. AW</text>
    <text x="1005" y="263" font-size="17" font-family="Inter, ui-sans-serif" fill="#d8fff0">Local buckets:</text>
    <text x="1005" y="292" font-size="15" font-family="monospace" fill="#65f0b5">sleep</text>
    <text x="1005" y="317" font-size="15" font-family="monospace" fill="#65f0b5">workout</text>
    <text x="1005" y="342" font-size="15" font-family="monospace" fill="#65f0b5">cycle/recovery</text>
  </g>
  <path d="M315 267h50" stroke="#65f0b5" stroke-width="5" marker-end="url(#arrow)"/><path d="M617 267h50" stroke="#65f0b5" stroke-width="5" marker-end="url(#arrow)"/><path d="M919 267h50" stroke="#65f0b5" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="70" y="410" width="1060" height="54" rx="18" fill="#0b1214" stroke="#2e6f58"/>
  <text x="95" y="444" font-size="18" font-family="monospace" fill="#c9ffe9">aw-importer-whoop sync --client-id "$WHOOP_CLIENT_ID" --client-secret "$WHOOP_CLIENT_SECRET"</text>
</svg>
